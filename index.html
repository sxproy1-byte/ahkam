.opt.no{background:var(--nob);border-color:var(--no);color:var(--no);opacity:1}

.rev b{color:var(--ok)}.tag{color:var(--mut);font-size:.82rem}

.hero{display:block;text-align:center;position:relative;overflow:hidden;padding:20px 16px 0;border-radius:24px;background:radial-gradient(circle at 50% 0,#1f9a80,#0f5c4a 55%,#083b30);border:2px solid var(--gold);box-shadow:0 10px 30px rgba(8,59,48,.35),inset 0 0 0 4px rgba(255,226,154,.15)}

c6|(يا أيها) الألف بعد الياء|محذوفة رسما ثابتة لفظا|ثابتة رسما|محذوفة لفظا|ممدودة
c6|الحرف الذي يكتب ولا ينطق في (أولئك) هو|الواو|الألف|الياء|الهمزة
c6|الواو الزائدة في رسم (أولوا) و(أولئك)|تكتب ولا تلفظ|تلفظ|تمد|تشدد
c6|(مائة) الألف الزائدة|تكتب ولا تلفظ|تلفظ|تمد|تشدد
c6|(لا أذبحنه) الألف بعد (لا)|تكتب ولا تلفظ|تلفظ|تمد|تشدد
c6|الفرق بين الحذف والإثبات الرسمي واللفظي|الرسمي في الخط واللفظي في النطق|لا فرق|اللفظي في الخط|الرسمي في النطق
c6|إذا اختلف الرسم عن النطق فالعمدة في القراءة|الرواية والتلقي عن الشيوخ|الرسم وحده|النحو|المعنى`;

const QS=RAW.split("\n").map(l=>{const p=l.split("|");return{l:p[0],q:p[1],a:p[2],w:p.slice(3)}});
const LN={};LV.forEach(v=>v[1].forEach(x=>LN[x[0]]=x[1]));
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cnt=id=>QS.filter(q=>q.l===id).length;
let cfg={},list=[],i=0,score=0,wrong=[],AC,mute=false;
function tone(f,t,d,ty,v){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=ty||"sine";o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(v||.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const sfx={ok:()=>{tone(660,0,.15);tone(880,.12,.28)},no:()=>{tone(210,0,.25,"sawtooth",.09);tone(150,.15,.32,"sawtooth",.09)},click:()=>tone(520,0,.07,"triangle",.09),win:()=>[523,659,784,1047].forEach((f,k)=>tone(f,k*.13,.35)),lose:()=>[392,330,262].forEach((f,k)=>tone(f,k*.2,.32,"triangle"))};
function confetti(){const c=["#1f6b4f","#e0b04a","#4fb98a","#d9534f","#4a90e2"];for(let k=0;k<60;k++){const e=document.createElement("i");e.className="cf";e.style.cssText=`left:${Math.random()*100}vw;background:${c[k%5]};animation-delay:${Math.random()*.7}s;--r:${Math.random()*720}deg`;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}}
$("snd").onclick=()=>{mute=!mute;$("snd").textContent=mute?"🔇 الصوت: مكتوم":"🔊 الصوت: يعمل";sfx.click()};

// بناء شاشة الإعداد
$("lvls").innerHTML=LV.map((v,k)=>`<div class="card"><div class="lvl"><h2>${v[0]}</h2><button class="link" data-all="${k}">تحديد الكل / إلغاء</button></div><div class="lessons">${v[1].map(x=>`<label class="les"><input type="checkbox" value="${x[0]}" checked><span>${x[1]}</span><small>${cnt(x[0])} سؤال</small></label>`).join("")}</div></div>`).join("");
const boxes=()=>[...document.querySelectorAll("#lvls input")];
const picked=()=>boxes().filter(b=>b.checked).map(b=>b.value);
const avail=()=>QS.filter(q=>picked().includes(q.l)).length;
function upd(){const a=avail();$("avail").textContent=a?`المتاح من الدروس المحددة: ${a} سؤال`:"اختر درسا واحدا على الأقل";$("start").disabled=!a;$("n").max=a}
document.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const g=b.closest(".card").querySelectorAll("input");const on=![...g].every(x=>x.checked);g.forEach(x=>x.checked=on);upd()});
boxes().forEach(b=>b.onchange=upd);
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{$("n").value=+c.dataset.n||avail();upd()});
upd();

function begin(){
  const ids=picked(),pool=QS.filter(q=>ids.includes(q.l));
  const n=Math.max(1,Math.min(+$("n").value||10,pool.length));
  cfg={ids,n};sfx.click();
  list=shuf(pool).slice(0,n);i=0;score=0;wrong=[];
  ["setup","res"].forEach(s=>$(s).classList.add("hide"));$("quiz").classList.remove("hide");show();
}
function show(){
  const q=list[i];
  $("cnt").textContent=`السؤال ${i+1} من ${list.length}`;$("sc").textContent=`الصحيح: ${score}`;
  $("pb").style.width=(i/list.length*100)+"%";
  $("qt").textContent=LN[q.l];$("qq").textContent=q.q;$("next").classList.add("hide");
  $("opts").innerHTML="";
  shuf([q.a,...q.w]).forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(b,t,q);$("opts").appendChild(b)});
}
function pick(b,t,q){
  document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.textContent===q.a)o.classList.add("ok")});
  if(t===q.a){score++;sfx.ok()}else{b.classList.add("no");sfx.no();wrong.push({q:q.q,a:q.a,y:t,l:q.l})}
  $("sc").textContent=`الصحيح: ${score}`;
  $("next").textContent=i===list.length-1?"عرض النتيجة":"التالي";$("next").classList.remove("hide");
}
$("next").onclick=()=>{if(++i<list.length)show();else finish()};
function finish(){
  $("quiz").classList.add("hide");$("res").classList.remove("hide");
  const p=Math.round(score/list.length*100);
  $("rs").innerHTML=`<svg viewBox="0 0 120 120" width="160" height="160"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--pri)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${p*3.267} 327" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="currentColor">${score}/${list.length}</text></svg>`;
  $("rm").textContent=`النسبة ${p}% — ${p>=90?"ممتاز، بارك الله فيك!":p>=70?"جيد جدا، راجع الأخطاء":p>=50?"مقبول، تحتاج مراجعة":"راجع الدروس وأعد المحاولة"}`;
  $("rv").innerHTML=wrong.length?`<h2 style="margin:14px 0 6px">مراجعة الأخطاء (${wrong.length})</h2>`+wrong.map(w=>`<div class="card rev"><div class="tag">${LN[w.l]}</div><div>${w.q}</div><div>إجابتك: ${w.y}</div><div>الصحيح: <b>${w.a}</b></div></div>`).join(""):`<div class="card">أجبت على كل الأسئلة بشكل صحيح 🎉</div>`;
  window.scrollTo(0,0);if(p>=70){sfx.win();confetti()}else sfx.lose();
}
$("start").onclick=begin;
$("again").onclick=()=>{ $("n").value=cfg.n;begin() };
$("back").onclick=()=>{$("res").classList.add("hide");$("setup").classList.remove("hide");upd()};
</script>
</body>
</html>
